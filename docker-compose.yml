name: nexo-assist

services:
  # Simulated legacy ticket system + help center (Python / FastAPI / SQLite).
  servicedesk:
    build:
      context: ./services/servicedesk
    environment:
      SERVICEDESK_API_KEY: ${SERVICEDESK_API_KEY:-dev-servicedesk-key}
      SERVICEDESK_FLAKY_RATE: ${SERVICEDESK_FLAKY_RATE:-0.1}
      # No colon on purpose: an empty value in .env turns the artificial latency off.
      SERVICEDESK_LATENCY_MS: ${SERVICEDESK_LATENCY_MS-40-250}
      SERVICEDESK_ADMIN: ${SERVICEDESK_ADMIN:-1}
    volumes:
      - servicedesk-data:/data
    ports:
      # Loopback only: the app reaches it through the compose network, the port is for debugging.
      - "127.0.0.1:${SERVICEDESK_PORT:-8100}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # docker compose --profile test run --rm --build servicedesk-test
  servicedesk-test:
    profiles: ["test"]
    build:
      context: ./services/servicedesk
      target: test

  # Next.js app: login, session, conversations (TypeScript). The agent and the chat come in later parts.
  web:
    build:
      context: ./apps/web
    depends_on:
      servicedesk:
        condition: service_healthy
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-before-deploying}
      SERVICEDESK_URL: http://servicedesk:8000
      SERVICEDESK_API_KEY: ${SERVICEDESK_API_KEY:-dev-servicedesk-key}
      DATABASE_PATH: /data/nexo-assist.db
      CHAT_MESSAGE_LIMIT: ${CHAT_MESSAGE_LIMIT:-30}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-haiku-5-5}
      # Only the key of the chosen provider is needed; empty values are treated as missing.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MASTRA_TELEMETRY_DISABLED: "1"
    volumes:
      - web-data:/data
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # docker compose --profile test run --rm --build web-test
  web-test:
    profiles: ["test"]
    build:
      context: ./apps/web
      target: test

volumes:
  servicedesk-data:
  web-data:
