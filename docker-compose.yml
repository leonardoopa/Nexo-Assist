name: nexo-assist

services:
  # Simulated legacy ticket system + help center (Python / FastAPI / SQLite).
  servicedesk:
    build:
      context: ./services/servicedesk
    environment:
      SERVICEDESK_API_KEY: ${SERVICEDESK_API_KEY:-dev-servicedesk-key}
      SERVICEDESK_FLAKY_RATE: ${SERVICEDESK_FLAKY_RATE:-0.1}
      # No colon on purpose: an empty value in .env turns the artificial latency off.
      SERVICEDESK_LATENCY_MS: ${SERVICEDESK_LATENCY_MS-40-250}
      SERVICEDESK_ADMIN: ${SERVICEDESK_ADMIN:-1}
    volumes:
      - servicedesk-data:/data
    ports:
      # Loopback only: the app reaches it through the compose network, the port is for debugging.
      - "127.0.0.1:${SERVICEDESK_PORT:-8100}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # docker compose --profile test run --rm --build servicedesk-test
  servicedesk-test:
    profiles: ["test"]
    build:
      context: ./services/servicedesk
      target: test

volumes:
  servicedesk-data:
